[bot]
; Max messages kept per chat in DB for LLM context window
max_history_messages = 20
; Default language for new chats before user picks one: en | ru | ua
default_lang = en

[defaults]
; Applied to every new chat row on first seen
; Toxicity: 1=cold irony, 5=nuclear Wednesday
toxicity_level = 3
; Bot answers approx 1 in every N messages; N is random in [freq_min..freq_max]
freq_min = 5
freq_max = 15
; Seconds before bot replies again to same user (direct replies to bot messages)
reply_cooldown_sec = 60
; Minutes cooldown for /explain in group chats (10..600, step 10)
explain_cooldown_min = 10
; How many messages back to walk a reply chain for context
reply_chain_depth = 5
; Minimum word count in a message before bot considers responding
min_words = 5

[groq]
; Primary model — current Groq production text model as of 2026-04
model = openai/gpt-oss-120b
; Automatic fallback when primary returns 503/over-capacity
fallback_model = openai/gpt-oss-20b
; Vision: qwen3.8-27b — Groq still has no dedicated vision model, only qwen; 3.8
; reads text far better than 3.6 (A/B 2026-09-13). Run with reasoning_format=hidden
; in ai/client.py so it does not burn the budget on <think> and starve the OCR.
vision_model  = qwen/qwen3.8-27b
whisper_model = whisper-large-v3-turbo
; Slightly above default for wit variance without hallucinations
temperature = 0.85
max_tokens = 1024
top_p = 0.95

[summarizer]
; Lighter model for background user summary updates (cost optimisation)
model = openai/gpt-oss-20b
max_tokens = 512
temperature = 0.3
